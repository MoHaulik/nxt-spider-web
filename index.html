<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="data:," />
    <title>Gossamer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #110d0a; color: #efe6d6; font-family: 'Cormorant Garamond', Georgia, serif; overflow: hidden; }
      #scene-container { position: fixed; inset: 0; }
      #landing { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 38%, rgba(60,44,30,0.55), rgba(10,8,6,0.96) 70%); transition: opacity 1.2s ease; z-index: 2; padding: 16px; text-align: center; }
      #landing.gone { opacity: 0; pointer-events: none; }
      h1 { font-weight: 300; letter-spacing: 0.42em; font-size: clamp(34px, 7vw, 64px); margin: 0 0 0 0.42em; }
      p { margin: 0; max-width: 460px; font-size: 19px; line-height: 1.45; color: #cbbfab; }
      .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
      button { font: inherit; font-size: 20px; letter-spacing: 0.08em; color: #1a130d; background: #efe6d6; border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer; }
      button.ghost { background: transparent; color: #efe6d6; box-shadow: inset 0 0 0 1px rgba(239,230,214,0.45); }
      button:hover { filter: brightness(1.08); }
      #note { font-size: 16px; color: #9d917f; max-width: 420px; }
      .thread { width: 1px; height: 90px; background: linear-gradient(#efe6d600, #efe6d6aa); margin-bottom: -10px; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <div class="thread"></div>
      <h1>GOSSAMER</h1>
      <p>A spider comes down into your room. Your hand moves it. Pinch to spin silk, catch flies, and keep your web alive.</p>
      <div class="row">
        <button id="enter">Enter your room</button>
        <button id="preview" class="ghost">Preview here</button>
      </div>
      <button id="fresh" class="ghost" hidden style="font-size:15px;padding:8px 20px">Begin a new web</button>
      <div id="note">Hands only. Best seated, with your room set up on the headset.</div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
