<!doctype html>
<html lang="en">
  <head>

    <style>
      html, body { margin: 0; height: 100%; background: #0d0a08; color: #efe6d6; font-family: 'Cormorant Garamond', Georgia, serif; overflow: hidden; }
      #scene-container { position: fixed; inset: 0; }
      #landing { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0d0a08; transition: opacity 1.4s ease; z-index: 2; padding: 16px; text-align: center; }
      #landing.gone { opacity: 0; pointer-events: none; }
      h1 { font-weight: 300; letter-spacing: 0.5em; font-size: clamp(30px, 6vw, 56px); margin: 0 0 0 0.5em; opacity: 0; animation: rise 2.4s ease 0.3s forwards; }
      #line { font-style: italic; font-weight: 300; font-size: clamp(19px, 2.6vw, 24px); color: #bfb29e; margin: 26px 0 64px; opacity: 0; animation: rise 2.4s ease 1.6s forwards; }
      #enter, #preview { font: inherit; font-size: 17px; letter-spacing: 0.32em; text-transform: lowercase; color: #efe6d6; background: none; border: 0;
        padding: 12px 8px 12px 14px; cursor: pointer; opacity: 0; animation: rise 2s ease 2.8s forwards; border-bottom: 1px solid rgba(239,230,214,0.35); }
      #enter:hover, #preview:hover { border-bottom-color: rgba(239,230,214,0.9); }
      #fresh { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); font: inherit; font-size: 13px; letter-spacing: 0.2em; text-transform: lowercase;
        color: #6f655a; background: none; border: 0; cursor: pointer; }
      #note { position: fixed; bottom: 22px; left: 0; right: 0; font-size: 14px; color: #6f655a; padding: 0 16px; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-Bjq_wWgs.js"></script>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <h1>GOSSAMER</h1>
      <div id="line">Build a home.</div>
      <button id="enter">enter</button>
      <button id="preview" hidden>watch</button>
      <button id="fresh" hidden>begin again</button>
      <div id="note" hidden>Open in the Meta Quest browser to play in your room.</div>
    </div>
  </body>
